<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="erclx logomark">
  <!-- The tab icon. Generated from src/assets/brand/mark.svg, which is the one
       drawing, with the ink resolved here rather than inherited: a favicon has
       no document to take currentColor from.

       Transparent rather than sitting on a disc. An inscribed circle at 16px
       leaves about 11 pixels of usable mark, which spends the aperture this
       drawing exists to protect.

       Chrome and Firefox honour the query below. Safari does not, so the mark
       has to read in whichever single color it picks, and it does: measured
       over the dark page it peaks at luminance 239 with 48 of 256 pixels above
       180. -->
  <style>
    .ink {
      stroke: #1a1815;
      fill: #1a1815;
    }
    @media (prefers-color-scheme: dark) {
      .ink {
        stroke: #f4efe6;
        fill: #f4efe6;
      }
    }
  </style>
  <path
    class="ink"
    d="M 67.5 50 A 25 25 0 1 0 56.84 70.48"
    fill="none"
    stroke-width="10"
    stroke-linecap="round"
  />
  <path
    class="ink"
    d="M 17.5 50 L 67.5 50"
    fill="none"
    stroke-width="10"
    stroke-linecap="round"
  />
  <rect class="ink" x="74.5" y="21" width="13" height="58" rx="1.5" stroke="none" />
</svg>
