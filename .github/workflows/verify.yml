name: Verify

on:
  # Unfiltered, so a stacked pull request is gated before its base lands.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main deploys on green, so a run there is never interrupted mid-flight.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-checks:
    name: 🔍 Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check Formatting
        run: bun run check:format

      - name: Check Spelling
        run: bun run check:spell

      - name: Check Shell
        run: bun run check:shell

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun run test:coverage

  build-verify:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # A week, not a day: 3.3MB costs nothing to keep, and it's what lets
          # deploy retry against this same artifact after a transient failure.
          retention-days: 7

  e2e-tests:
    name: 🎭 E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, build-verify]
    strategy:
      # One red engine leaves the other two results readable.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
          - browser: firefox
            # Headless firefox creates no GL context without an X display, and
            # no pref substitutes for one. Chromium carries SwiftShader and
            # webkit its own path, so neither needs this.
            wrapper: xvfb-run -a
          - browser: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Engine in the key, so a warm chromium-only cache cannot report a hit
          # and skip the install of a browser this leg has never fetched.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright System Dependencies
        # Unconditional. The cache holds browser binaries and nothing apt wrote,
        # so gating this on a miss leaves a warm run launching webkit without
        # the libraries it needs, which fails at launch rather than at install.
        run: bunx playwright install-deps ${{ matrix.browser }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install ${{ matrix.browser }}

      - name: Run E2E Tests
        run: ${{ matrix.wrapper }} bun run test:e2e --project=${{ matrix.browser }}
        env:
          # Tells the webServer command to serve the downloaded dist/ rather
          # than building its own. Unset locally, where a build always runs.
          DIST_PREBUILT: 'true'

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Unique per leg. A duplicate artifact name fails the upload.
          name: playwright-report-${{ matrix.browser }}
          # Both, because the report renders the run and test-results carries
          # the traces and the error context a failing engine is read from.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, unit-tests, build-verify, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This job builds nothing, and it still needs a toolchain. wrangler-action
      # reads the lockfile the checkout brings in, picks the package manager
      # behind it, and installs wrangler with that, so a deploy with no bun on
      # PATH fails before it reaches Cloudflare. Removing these as dead weight
      # is what broke the deploy on every push after #84.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=erclx-dev --branch=main
