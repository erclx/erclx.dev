name: Verify

on:
  # Unfiltered, so a stacked pull request is gated before its base lands.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Event in the key: a push cannot cancel a dispatch that is mid-upload, since
  # the queued run decides cancellation and a push would always decide yes.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never interrupt a run carrying a deploy: main, or a dispatch on any ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  static-checks:
    name: 🔍 Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check Formatting
        run: bun run check:format

      - name: Check Spelling
        run: bun run check:spell

      - name: Check Shell
        run: bun run check:shell

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun run test:coverage

  build-verify:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # A week, not a day: 3.3MB costs nothing to keep, and it's what lets
          # deploy retry against this same artifact after a transient failure.
          retention-days: 7

  e2e-tests:
    name: 🎭 E2E Tests (${{ matrix.slug }})
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, build-verify]
    strategy:
      # One red engine leaves the other two results readable.
      fail-fast: false
      matrix:
        include:
          # Chromium alone splits: it is the only leg still above webkit's
          # 9.1m floor once divided, so a third shard would mostly idle.
          - browser: chromium
            shard: '1/2'
            slug: chromium-1
          - browser: chromium
            shard: '2/2'
            slug: chromium-2
          - browser: firefox
            slug: firefox
            # Headless firefox creates no GL context without an X display, and
            # no pref substitutes for one. Chromium carries SwiftShader and
            # webkit its own path, so neither needs this.
            wrapper: xvfb-run -a
          - browser: webkit
            slug: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --only-changed below diffs HEAD against the base branch, which a
          # depth-1 checkout carries no history to do.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Engine in the key, so a warm chromium-only cache cannot report a hit
          # and skip the install of a browser this leg has never fetched.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright System Dependencies
        # Unconditional. The cache holds browser binaries and nothing apt wrote,
        # so gating this on a miss leaves a warm run launching webkit without
        # the libraries it needs, which fails at launch rather than at install.
        run: bunx playwright install-deps ${{ matrix.browser }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install ${{ matrix.browser }}

      - name: Run E2E Tests
        # A pull request runs only the specs whose import graph reaches a
        # changed file, and only when every changed file sits under e2e/.
        # These specs drive a served build rather than importing it, so a
        # source file outside e2e/ reaches no spec's import graph at all: on
        # its own that selects nothing and the fallback below runs everything,
        # but paired with an edited spec file the selection comes back
        # non-empty on that spec alone, silently skipping every spec the
        # source change actually affects. Measured over the last 30 merged
        # pull requests, 16 touched src/ and e2e/ together against 0 touching
        # e2e/ alone, so scoping the selection to an e2e/-only diff is what
        # keeps it from ever under-selecting rather than a defense against a
        # rare case.
        #
        # A push to main and a dispatch run everything, and so does a pull
        # request whose e2e/-only change reaches no spec at all: a workflow or
        # dependency edit is exactly the case most likely to break the suite,
        # so an empty selection is not read as nothing to test.
        #
        # A pull request's own run is therefore the wrong instrument for a
        # worker-count comparison whenever its diff selects a narrow set of
        # specs, since the leg times it reports are for that set rather than
        # for the suite. A `workflow_dispatch` run on the branch always takes
        # the full-suite path below and is what a worker-count reading is
        # taken from instead.
        run: |
          shard_flag=""
          if [ -n "${{ matrix.shard }}" ]; then
            shard_flag="--shard=${{ matrix.shard }}"
          fi

          total=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^e2e/'; then
              total=$(bunx playwright test --project=${{ matrix.browser }} $shard_flag \
                --only-changed="origin/${{ github.base_ref }}" --list 2>&1 |
                grep -oP 'Total: \K[0-9]+(?= tests?)')
            fi
          fi

          if [ "${total:-0}" -gt 0 ]; then
            # Defense in depth: total already gates this branch on a nonzero
            # --list count for this shard, so --pass-with-no-tests guards
            # only a --list/run disagreement rather than the ordinary path.
            ${{ matrix.wrapper }} bunx playwright test --project=${{ matrix.browser }} $shard_flag \
              --only-changed="origin/${{ github.base_ref }}" --pass-with-no-tests
          else
            # A zero here can mean no e2e/-only diff, or one whose changed
            # specs all land in the other shard, and the two are conflated:
            # the second runs this shard's full half rather than nothing.
            # Latent today, since none of the last 30 merged pull requests
            # were e2e/-only. See canon/context/ci.md for the measurement.
            ${{ matrix.wrapper }} bun run test:e2e --project=${{ matrix.browser }} $shard_flag
          fi
        env:
          # Tells the webServer command to serve the downloaded dist/ rather
          # than building its own. Unset locally, where a build always runs.
          DIST_PREBUILT: 'true'

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Unique per leg, including shard: a duplicate artifact name fails
          # the upload, and two chromium jobs both carry matrix.browser.
          name: playwright-report-${{ matrix.slug }}
          # Both, because the report renders the run and test-results carries
          # the traces and the error context a failing engine is read from.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Gated on the build alone, and dispatch only, so a reviewer waiting on a
  # preview does not wait on the browser matrix. The artifact is already built
  # by then and the matrix says nothing about whether a page renders. What keeps
  # it safe is the same ref fence production uses: the deploy names the branch,
  # so an unmerged ref lands on a preview host and cannot reach the apex.
  #
  # The steps below repeat the ones under `deploy`, and the copy stands rather
  # than moving into a composite action under `.github/actions/`. `canon pr
  # preview` finds a project's deploy by scanning `.github/workflows/` for a
  # workflow that runs `pages deploy` and carries a `workflow_dispatch`
  # trigger, so a command extracted out of this file leaves the verb reporting
  # `no-deploy` against a repository that deploys perfectly well. Measured on
  # this branch, which extracted it and had to put it back.
  preview:
    name: 🌐 Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build-verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This job builds nothing, and it still needs a toolchain. wrangler-action
      # reads the lockfile the checkout brings in, picks the package manager
      # behind it, and installs wrangler with that, so a deploy with no bun on
      # PATH fails before it reaches Cloudflare. Removing these as dead weight
      # is what broke the deploy on every push after #84.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ref-derived, so only main reaches the apex. Every other ref lands on
          # a preview host, which is what makes a dispatch safe to fire early.
          command: pages deploy ./dist --project-name=erclx-dev --branch=${{ github.ref_name }}

      # Read out of this log rather than computed from the branch. Cloudflare
      # flattens a branch into its alias and may truncate it, so a computed
      # address that is wrong is worse than none.
      #
      # `printf` with the marker as an argument rather than `echo` with it in
      # the string. A runner prints the command it is about to run, so the
      # marker inside a quoted string appears twice in the log, and the reader
      # takes the first hit and captures the closing quote with it. Measured as
      # an address ending in a quote character on run 35485278535.
      - name: Print Preview Alias
        run: |
          printf '%s: %s\n' 'canon-preview-alias' '${{ steps.deploy.outputs.pages-deployment-alias-url }}'

  # Production keeps every gate. A push to main is the only thing that reaches
  # the apex, so nothing ships there without the full suite behind it.
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, unit-tests, build-verify, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This job builds nothing, and it still needs a toolchain. wrangler-action
      # reads the lockfile the checkout brings in, picks the package manager
      # behind it, and installs wrangler with that, so a deploy with no bun on
      # PATH fails before it reaches Cloudflare. Removing these as dead weight
      # is what broke the deploy on every push after #84.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ref-derived, so only main reaches the apex. Every other ref lands on
          # a preview host, which is what makes a dispatch safe to fire early.
          command: pages deploy ./dist --project-name=erclx-dev --branch=${{ github.ref_name }}

      # Read out of this log rather than computed from the branch. Cloudflare
      # flattens a branch into its alias and may truncate it, so a computed
      # address that is wrong is worse than none.
      #
      # `printf` with the marker as an argument rather than `echo` with it in
      # the string. A runner prints the command it is about to run, so the
      # marker inside a quoted string appears twice in the log, and the reader
      # takes the first hit and captures the closing quote with it. Measured as
      # an address ending in a quote character on run 35485278535.
      - name: Print Preview Alias
        run: |
          printf '%s: %s\n' 'canon-preview-alias' '${{ steps.deploy.outputs.pages-deployment-alias-url }}'
